<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitzroy</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main id="app" class="container">
      <header class="header">
        <span class="header-title">Fitzroy</span>
        <button id="app-menu" class="header-menu" title="메뉴" aria-label="메뉴">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <circle cx="2.5" cy="4" r="1" />
            <circle cx="2.5" cy="8" r="1" />
            <circle cx="2.5" cy="12" r="1" />
            <rect x="5.5" y="3.4" width="9" height="1.2" rx="0.6" />
            <rect x="5.5" y="7.4" width="9" height="1.2" rx="0.6" />
            <rect x="5.5" y="11.4" width="9" height="1.2" rx="0.6" />
          </svg>
        </button>
      </header>
      <button id="update-banner" class="update-banner" hidden></button>
      <div id="cards" class="cards"></div>
      <section id="about" class="card about" hidden>
        <div class="about-title">Fitzroy <span id="about-version" class="muted"></span></div>
        <p class="muted">
          Anthropic, OpenAI와 무관한 비공식 앱입니다. 비공개 API를 사용하므로 언제든 동작하지 않을 수
          있습니다.
        </p>
        <p id="about-update" class="muted" hidden></p>
        <div class="about-actions">
          <button id="about-repository" class="text-button">GitHub에서 보기 ↗</button>
          <button id="about-close" class="text-button">닫기</button>
        </div>
      </section>
    </main>
  </body>
</html>
